name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        echo "No dependencies to install for this project"
    
    - name: Validate HTML
      run: |
        echo "Validating HTML files..."
        find . -name "*.html" -exec echo "Checking {}" \;
    
    - name: Validate CSS
      run: |
        echo "Validating CSS files..."
        find . -name "*.css" -exec echo "Checking {}" \;
    
    - name: Validate JavaScript
      run: |
        echo "Validating JavaScript files..."
        find . -name "*.js" -exec echo "Checking {}" \;
    
    - name: Check Arduino code
      run: |
        echo "Checking Arduino code structure..."
        if [ -f "pepe.ino" ]; then
          echo "Arduino file found: pepe.ino"
        else
          echo "Arduino file not found"
          exit 1
        fi
